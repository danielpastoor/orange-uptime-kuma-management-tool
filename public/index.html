<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orange Uptime Kuma — Klantenoverzicht</title>
    <link rel="stylesheet" href="/style.css" />
</head>
<body>

<header>
    <span class="logo">Orange Uptime Kuma</span>
    <span class="subtitle">Klant-gezondheidsdashboard</span>
</header>

<div class="container">

    <div class="toolbar">
        <div class="toolbar-text">
            <h2>Klantomgevingen</h2>
            <p class="muted">Read-only overzicht. Provisioning verloopt via Semaphore &rarr; Argo CD.</p>
        </div>
        <a id="new-customer-btn" class="btn btn-primary" href="#" target="_blank" rel="noopener">
            Nieuwe klant aanmaken
        </a>
    </div>

    <div class="card">
        <div class="table-wrap">
            <table id="customers-table">
                <thead>
                    <tr>
                        <th>Klant</th>
                        <th>Lane</th>
                        <th>E-mail</th>
                        <th>Pods</th>
                        <th>Argo CD</th>
                        <th>Laatste commit</th>
                        <th>Aangemaakt</th>
                    </tr>
                </thead>
                <tbody id="customers-body">
                    <tr><td colspan="7" class="empty-state">Laden&hellip;</td></tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<footer>
    <span id="build-version"></span>
</footer>

<script src="/app.js"></script>
</body>
</html>
