apiVersion: apps/v1
kind: Deployment
metadata:
  name: kuma-<CUSTOMER_ID>
  namespace: default
  labels:
    app: orange-uptime-kuma
    customer: <CUSTOMER_ID>
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orange-uptime-kuma
      customer: <CUSTOMER_ID>
  template:
    metadata:
      labels:
        app: orange-uptime-kuma
        customer: <CUSTOMER_ID>
    spec:
      containers:
        - name: kuma
          image: orange-uptime-kuma:latest
          ports:
            - containerPort: 3001
          env:
            - name: CUSTOMER_NAME
              value: "<CUSTOMER_NAME>"
            - name: CUSTOMER_ID
              value: "<CUSTOMER_ID>"
            - name: CUSTOMER_EMAIL
              value: "<CUSTOMER_EMAIL>"
            - name: CUSTOMER_DOMAIN
              value: "<CUSTOMER_DOMAIN>"
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: kuma-<CUSTOMER_ID>
  namespace: default
  labels:
    app: orange-uptime-kuma
    customer: <CUSTOMER_ID>
spec:
  selector:
    app: orange-uptime-kuma
    customer: <CUSTOMER_ID>
  ports:
    - port: 3001
      targetPort: 3001
  type: ClusterIP
